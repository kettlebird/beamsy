<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beamsy Play listing</title>
<!--
  Google Play listing art for Beamsy, in the Concept C style of ../beamsy-ui.html.
  ?asset=icon | feature | tvbanner renders one asset alone at 0,0 at its exact pixel size (render.py uses this).
  With no ?asset, every asset is shown on one board for review.
-->
<style>
@font-face { font-family: "Open Sauce Sans"; font-weight: 500; src: url("../../app/src/main/res/font/open_sauce_sans_medium.ttf"); }
@font-face { font-family: "Open Sauce Sans"; font-weight: 600; src: url("../../app/src/main/res/font/open_sauce_sans_semibold.ttf"); }

:root {
  --canvas: #0C0C0D; --canvas-top: #1C1C20;
  --text: #F5F5F7; --text-2: rgba(245,245,247,.62);
  --ready: #30D158;
  --font: "Open Sauce Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #2a2a2a; color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body.board { padding: 40px; display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
body.board h2 { font: 600 14px system-ui; color: #aaa; margin-bottom: 10px; }
body.single { background: var(--canvas); overflow: hidden; }
.asset { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--canvas-top) 0%, var(--canvas) 70%); }
.mark { display: block; color: var(--text); }

/* ---- 512×512 hi-res icon: full bleed, Play applies the corner mask and shadow ---- */
#icon { width: 512px; height: 512px; display: grid; place-items: center; background: linear-gradient(180deg, #2B2B30 0%, #0E0E10 100%); }
#icon .mark { margin: 6px 0 0 6px; } /* optical centre: the mark's mass sits up-left */

/* ---- 1024×500 feature graphic ---- */
#feature { width: 1024px; height: 500px; }
#feature .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
#feature .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
#feature h1 { margin-top: 26px; font-size: 56px; font-weight: 600; letter-spacing: -.04em; line-height: 1.02; }
#feature p { margin-top: 18px; font-size: 20px; font-weight: 500; line-height: 1.4; color: var(--text-2); max-width: 470px; }
#feature .device { left: 690px; top: 70px; }

/* ---- 1280×720 TV banner ---- */
#tvbanner { width: 1280px; height: 720px; display: flex; align-items: center; justify-content: center; gap: 44px; }
#tvbanner .word { font-size: 176px; font-weight: 600; letter-spacing: -.045em; line-height: 1; margin-bottom: 14px; }

/* ---- iPhone illustration (same drawing as the app's home screen, final step) ---- */
.device { position: absolute; width: 276px; height: 588px; padding: 9px; border-radius: 51px; background: #1A1A1C; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.16), 0 40px 90px rgba(0,0,0,.6); }
.screen { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: linear-gradient(165deg, #34343A 0%, #1B1B20 55%, #121215 100%); }
.island { position: absolute; left: 50%; top: 13px; width: 78px; height: 24px; margin-left: -39px; border-radius: 12px; background: #000; }
.time { position: absolute; left: 30px; top: 18px; font-size: 13px; font-weight: 600; }
.cc { position: absolute; inset: 0; padding: 63px 21px 0; background: rgba(8,8,10,.62); display: grid; grid-template-columns: repeat(4, 45px); grid-auto-rows: 45px; gap: 12px;
  grid-template-areas: "a a b b" "a a b b" "r m l v" "t t l v" "c d e f"; }
.cc > i { border-radius: 15px; background: rgba(255,255,255,.14); }
.cc > i { opacity: .35; } /* dimmed behind the sheet, as on iOS */
.cc .a { grid-area: a; border-radius: 24px; display: grid; grid-template-columns: 1fr 1fr; padding: 10px; gap: 9px; }
.cc .a b { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.22); margin: auto; }
.cc .a b:first-child { background: #fff; }
.cc .b { grid-area: b; border-radius: 24px; } .cc .r { grid-area: r; border-radius: 50%; } .cc .m { grid-area: m; background: #fff; }
.cc .l { grid-area: l; border-radius: 18px; background: linear-gradient(to top, #fff 55%, rgba(255,255,255,.14) 55%); }
.cc .v { grid-area: v; border-radius: 18px; background: linear-gradient(to top, #fff 35%, rgba(255,255,255,.14) 35%); }
.cc .t { grid-area: t; border-radius: 18px; } .cc .c, .cc .d, .cc .e, .cc .f { border-radius: 50%; }
.sheet { position: absolute; left: 18px; right: 18px; top: 168px; padding: 18px 12px 12px; border-radius: 27px; background: rgba(44,44,48,.97); box-shadow: 0 18px 45px rgba(0,0,0,.5); }
.sheet h4 { font-size: 15px; font-weight: 600; text-align: center; margin-bottom: 15px; }
.sheet .row { display: flex; align-items: center; gap: 12px; height: 45px; padding: 0 14px; border-radius: 15px; background: rgba(255,255,255,.2); font-size: 15px; font-weight: 600; }
.sheet .row span { flex: 1; }
.sheet .hint { margin: 12px 6px 3px; font-size: 12px; font-weight: 500; line-height: 1.35; color: rgba(255,255,255,.45); text-align: center; }
</style>
</head>
<body>
<template id="markTpl">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <mask id="cut"><rect width="100" height="100" fill="#fff"/><rect x="18" y="42" width="48" height="26" rx="4" fill="#000"/></mask>
    <rect x="58" y="10" width="30" height="52" rx="8" fill="currentColor" fill-opacity=".42"/>
    <rect x="10" y="34" width="64" height="42" rx="9" fill="currentColor" mask="url(#cut)"/>
    <rect x="29" y="82" width="26" height="6" rx="3" fill="currentColor"/>
  </svg>
</template>

<script>
const mark = px => document.getElementById("markTpl").innerHTML.replace('class="mark"', `class="mark" width="${px}" height="${px}"`);
const device = name => `<div class="device"><div class="screen">
  <span class="time">9:41</span><span class="island"></span>
  <div class="cc"><i class="a"><b></b><b></b><b></b><b></b></i><i class="b"></i><i class="r"></i><i class="m"></i><i class="l"></i><i class="v"></i><i class="t"></i><i class="c"></i><i class="d"></i><i class="e"></i><i class="f"></i></div>
  <div class="sheet"><h4>Screen Mirroring</h4>
    <div class="row"><svg width="19" height="16" viewBox="0 0 13 11" fill="none" stroke="currentColor" stroke-width="1.4"><rect x=".7" y=".7" width="11.6" height="7.6" rx="1.5"/><path d="M4 10.3h5" stroke-linecap="round"/></svg>
      <span>${name}</span><svg width="16" height="13" viewBox="0 0 11 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4.6 4 7.6 10 1.4"/></svg></div></div>
</div></div>`;

const ASSETS = {
  icon: { label: "Hi-res icon · 512×512 PNG", html: () => `<div class="asset" id="icon">${mark(330)}</div>` },
  feature: { label: "Feature graphic · 1024×500", html: () => `<div class="asset" id="feature">
    <div class="copy">
      <div class="brand">${mark(34)}Beamsy</div>
      <h1>Your iPhone,<br>on the big screen.</h1>
      <p>Screen Mirroring for Android TV. Nothing to install on the iPhone.</p>
    </div>${device("Living Room")}</div>` },
  tvbanner: { label: "TV banner · 1280×720", html: () => `<div class="asset" id="tvbanner">${mark(230)}<span class="word">Beamsy</span></div>` },
};

const only = new URLSearchParams(location.search).get("asset");
document.body.className = only ? "single" : "board";
document.body.insertAdjacentHTML("beforeend", only
  ? ASSETS[only].html()
  : Object.values(ASSETS).map(a => `<section><h2>${a.label}</h2>${a.html()}</section>`).join(""));
</script>
</body>
</html>
